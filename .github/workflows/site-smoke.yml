name: Public website static smoke checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, design/mountain-town-homepage]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/site-smoke.mjs
      # Draft work can use temporary scenery. A review-ready PR, production
      # push, or explicit launch check must contain the exact approved town.
      - name: Verify approved public launch artwork and branding
        if: >-
          (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch'
        run: node scripts/launch-gate.mjs
