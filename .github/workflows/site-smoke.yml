name: Public website static smoke checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, design/mountain-town-homepage]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/site-smoke.mjs
      # The approved artwork is now present; verify it on every draft and release build.
      - run: node scripts/launch-gate.mjs
