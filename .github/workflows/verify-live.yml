name: Verify public website and HQ poster feed live
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-public-site-live
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check poster script syntax
        run: node --check published-posters.js
      - name: Verify deployed custom domain and anonymous HQ projection
        run: node scripts/verify-live.mjs
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify actual HQ-locked artwork in both live mobile sites
        run: node scripts/verify-live-browser.mjs
      - name: Test live poster refresh and lock precedence without modifying HQ
        run: node scripts/verify-poster-refresh-browser.mjs
